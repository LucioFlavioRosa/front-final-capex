# nginx do ses-frontend rodando CONTRA O OTIMIZADOR LOCAL.
#
# O `nginx.conf` do repositório serve só os arquivos: em produção o `/api` chega
# ao backend pelo ingress, na mesma origem. Localmente não há ingress, e o
# cliente HTTP (`src/lib/api.ts`) monta caminho relativo — `/api/...` — de
# propósito, para o cookie de sessão viajar sem CORS. Sem o proxy abaixo, toda
# chamada cairia no `try_files` da SPA e voltaria `index.html` com status 200;
# o cliente tem uma checagem para isso e diria "a rota provavelmente não chegou
# ao backend", que é exatamente o que estaria acontecendo.
#
# `api:8000` é o nome do serviço na rede do compose do Otimizador — o mesmo
# destino que o nginx do front atual usa (`dev/nginx-e2e.conf`).
server {
    listen 80;
    # IPv6 TAMBEM, e nao por completude: o HEALTHCHECK do Dockerfile chama
    # `wget http://localhost:80`, e dentro do container `localhost` resolve
    # primeiro para `::1`. So com IPv4 o nginx recusava a conexao e o container
    # ficava "unhealthy" servindo paginas normalmente para o mundo de fora.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SEM BARRA FINAL no proxy_pass: o backend monta as rotas sob /api, então o
    # caminho precisa chegar inteiro. Com a barra, o nginx cortaria o prefixo e
    # o servidor responderia 404 em tudo.
    location /api/ {
        proxy_pass       http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Rodada grande demora; o padrão de 60s cortaria a espera do disparo.
        proxy_read_timeout 300s;
    }

    # O app checa a saúde do servidor por aqui.
    location = /readyz {
        proxy_pass       http://api:8000/readyz;
        proxy_set_header Host $host;
    }

    # assets com hash no nome podem ter cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota cai no index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
